<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colonists — Configure Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <div class="brand">⚓ <span>COLONISTS</span></div>
      <div class="sub">Trade, build, expand — a multiplayer island game</div>
    </div>
    <span class="muted small">LOBBY</span>
  </header>
 <section class="panel setup" id="setup">
   <h2>
    Configure your lobby
   </h2>
   <p id="lobbyCreatorName" class="muted">TEST</p>
   <div class="setupgrid2">

<div>
    <label for="maximumPlayers">Maximum Players</label>
    <input
        type="range"
        id="maximumPlayers"
        min="2"
        max="6"
        step="1"
        value="4"
    >
    <div class="slider-labels"></div>
</div>

<div>
    <label for="mapSize">Map Size</label>
    <input
        type="range"
        id="mapSize"
        min="1"
        max="3"
        step="1"
        value="1"
        data-labels='{"1":"Tiny","2":"Normal","3":"Large"}'
    >
    <div class="slider-labels"></div>
</div>

<div>
    <label for="victoryPointsNeeded">Victory Points Needed</label>
    <input
        type="range"
        id="victoryPointsNeeded"
        min="5"
        max="15"
        step="1"
        value="10"
    >
    <div class="slider-labels"></div>
</div>

    <button id="createBtn">
      Start Game
    </button>

    <div class="full muted small">
     Start the classic colonists game, but then free!
    </div>
   </div>
   <div class="notice hidden" id="setupMsg">
   </div>
  </section>
  <script src="app.js" type="module"></script>
</body>
</html>
